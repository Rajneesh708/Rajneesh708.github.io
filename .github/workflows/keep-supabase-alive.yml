name: Keep Supabase Alive

# Keeps the MECULS website Supabase project (login and profiles) active.
# Free-tier Supabase projects pause after 7 days with no real database use.
#
# Rewritten 2026-11-07. The old version only opened the bare /rest/v1/ address.
# Supabase answers that without touching the database, so it did NOT count as
# activity (this is why meculs-pulse got paused). This version asks the
# database for one row of the "profiles" table, using the public anon key
# (the same public key already inside config.js on the live site; it is not a secret).
#
# meculs-pulse (qkhrxhzxrbikeryhzngc) is not used by the website and is left out
# on purpose. Add it back only after it is resumed and its public key is known.

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping Supabase REST endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ask the database for one row
        run: |
          REF=fjxcphhhddfwrlkpshyw
          KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZqeGNwaGhoZGRmd3Jsa3BzaHl3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2MDgwOTYsImV4cCI6MjA5MzE4NDA5Nn0.83h3FhLbRP7sz4K5Aomek-Ns3L9IfVZ6kFNKJcc_6YM"
          STATUS=$(curl -s -o /tmp/body.txt -w "%{http_code}" \
            --max-time 30 --retry 3 --retry-delay 5 \
            -H "apikey: ${KEY}" -H "Authorization: Bearer ${KEY}" \
            "https://${REF}.supabase.co/rest/v1/profiles?select=id&limit=1")
          echo "Project ${REF}: HTTP ${STATUS} at $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "Reply starts: $(head -c 150 /tmp/body.txt)"
          # 2xx = database answered. 401/403 = database refused this key but was reached.
          if [[ "$STATUS" =~ ^2[0-9][0-9]$ || "$STATUS" == "401" || "$STATUS" == "403" ]]; then
            echo "OK: database was reached."
          else
            echo "FAIL: unexpected status. The project may be paused or the table name changed."
            exit 1
          fi

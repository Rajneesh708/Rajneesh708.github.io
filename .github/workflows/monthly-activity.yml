name: Monthly Activity (keeps scheduled workflows alive)

# GitHub switches OFF scheduled workflows (like Keep Supabase Alive) when a
# public repository has had no activity for 60 days. This workflow runs once
# a month, records a one-line timestamp in .github/last-activity.txt, commits
# it, and also re-enables the Keep Supabase Alive workflow. That keeps the
# repository "active", so nobody has to remember a monthly commit.
#
# Added 2026-10-31. Safe to run by hand: Actions tab > Monthly Activity >
# Run workflow.

on:
  schedule:
    # 03:30 UTC on the 1st and 15th of every month (twice a month for safety)
    - cron: '30 3 1,15 * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  activity:
    name: Record activity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write timestamp and commit
        run: |
          echo "Last automatic activity: $(date -u +'%Y-%m-%d %H:%M UTC')" > .github/last-activity.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-activity.txt
          git commit -m "Monthly activity timestamp [skip ci]" || echo "Nothing to commit"
          git push

      - name: Make sure Keep Supabase Alive is enabled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow enable keep-supabase-alive.yml --repo "$GITHUB_REPOSITORY" || echo "Could not re-enable (already enabled is fine)"

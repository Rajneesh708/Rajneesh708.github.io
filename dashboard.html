<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MECULS · Ikshu — Where True Capability Gets Recognised</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    /* ════════════════════════════════════════════════
       DESIGN TOKENS
       Deep Forest Green · Burnished Gold · Warm White
    ════════════════════════════════════════════════ */
    :root {
      /* Sidebar — deep Prussian blue */
      --blue-950:  #070d18;
      --blue-900:  #0c1a2e;
      --blue-800:  #102238;
      --blue-700:  #152c48;
      --blue-600:  #1a3858;
      --blue-border: rgba(255,255,255,0.08);
      --blue-border-gold: rgba(180,140,50,0.25);

      /* Gold — single accent */
      --gold:        #c8973d;
      --gold-light:  #ddb060;
      --gold-pale:   #eecb88;
      --gold-faint:  #f5e0b0;

      /* Text on dark — ALL at comfortable reading contrast */
      --on-dark-high:    rgba(255,255,255,0.95);   /* headings, active items */
      --on-dark-mid:     rgba(255,255,255,0.78);   /* nav items — fully readable */
      --on-dark-low:     rgba(255,255,255,0.62);   /* labels, secondary — readable */
      --on-dark-muted:   rgba(255,255,255,0.45);   /* timestamps, hints — still legible */

      /* Content area — warm off-white, not cold grey */
      --surface:     #f6f4ef;
      --surface-2:   #ffffff;
      --border:      #dedad3;
      --border-soft: #ede9e2;

      /* Text on light */
      --text-h:      #161412;
      --text-body:   #3d3830;
      --text-soft:   #6e6860;
      --text-muted:  #9c9590;

      /* Semantic */
      --green:         #1f6b44;
      --green-bg:      #eaf5ef;
      --green-border:  #96d4b0;

      /* Layout */
      --sidebar-w: 276px;
      --topbar-h:  56px;

      /* Type */
      --serif: 'EB Garamond', Georgia, serif;
      --sans:  'Jost', system-ui, sans-serif;

      /* Motion */
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
      --t1: 0.14s;
      --t2: 0.24s;
    }

    /* ════════════════════════════════════════════════
       RESET
    ════════════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: var(--sans);
      background: var(--surface);
      color: var(--text-body);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ════════════════════════════════════════════════
       LAYOUT
    ════════════════════════════════════════════════ */
    .shell { display: flex; min-height: 100vh; }

    /* ════════════════════════════════════════════════
       SIDEBAR — deep Prussian blue
       Character: a private library in a manor house.
       The green of old money, of permanence, of trust.
    ════════════════════════════════════════════════ */
    .sidebar {
      width: var(--sidebar-w);
      position: fixed;
      inset: 0 auto 0 0;
      display: flex;
      flex-direction: column;
      overflow-y: hidden;
      z-index: 200;

      /* Prussian blue base with gold warmth bloom at top-left */
      background-color: var(--blue-900);
      background-image:
        radial-gradient(
          ellipse 320px 240px at -5% -10%,
          rgba(180,140,50,0.11) 0%,
          transparent 60%
        ),
        radial-gradient(
          ellipse 200px 300px at 110% 105%,
          rgba(5,15,40,0.7) 0%,
          transparent 65%
        );

      /* Right edge: thin gold rule */
      box-shadow:
        1px 0 0 var(--blue-border-gold),
        6px 0 40px rgba(0,0,0,0.5);
    }

    /* Top gold accent bar */
    .sidebar::before {
      content: '';
      display: block;
      flex-shrink: 0;
      height: 2px;
      background: linear-gradient(
        90deg,
        transparent 0%,
        var(--gold) 25%,
        var(--gold-pale) 60%,
        transparent 100%
      );
    }

    .sidebar::-webkit-scrollbar { width: 2px; }
    .sidebar::-webkit-scrollbar-thumb {
      background: rgba(180,140,50,0.2);
      border-radius: 1px;
    }

    /* ── Brand ── */
    .sidebar__brand {
      padding: 14px 28px 14px;
      border-bottom: 1px solid var(--blue-border);
      flex-shrink: 0;
    }

    /* Logo image: gold-white variant — correct for green bg */
    .brand__img {
      display: block;
      height: 32px;
      width: auto;
      max-width: 158px;
      object-fit: contain;
      margin-bottom: 14px;
    }

    /* Typographic fallback */
    .brand__text {
      display: none;
      font-family: var(--serif);
      font-size: 1.7rem;
      font-weight: 500;
      font-style: italic;
      letter-spacing: 0.1em;
      line-height: 1;
      margin-bottom: 14px;
      background: linear-gradient(
        110deg,
        var(--gold-faint) 0%,
        var(--gold-light) 45%,
        var(--gold) 100%
      );
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Sub-brand: Ikshu (इक्षु): The CV Portal */
    .brand__subbrand {
      font-family: var(--serif);
      font-size: 1.05rem;
      font-style: normal;
      font-weight: 600;
      color: var(--gold);
      letter-spacing: 0.04em;
      line-height: 1.35;
      margin-bottom: 14px;
    }
    .brand__subbrand-deva {
      font-family: 'Noto Sans Devanagari', 'Mangal', 'Hind', sans-serif;
      font-style: normal;
      font-weight: 600;
      font-size: 1.02rem;
      letter-spacing: 0.05em;
    }

    /* Tagline — readable, gold-tinted, full presence */
    .brand__tagline {
      font-family: var(--sans);
      font-size: 0.7rem;
      font-style: normal;
      font-weight: 500;
      color: var(--gold);
      letter-spacing: 0.02em;
      line-height: 1.55;
      opacity: 1;
    }

    /* ── Nav inspiration label ── */
    .sidebar__inspire {
      padding: 18px 24px 0;
      flex-shrink: 0;
    }

    .sidebar__inspire-text {
      font-family: var(--serif);
      font-size: 0.95rem;
      font-weight: 400;
      font-style: italic;
      /* Gold-tinted, fully readable */
      color: var(--gold-pale);
      line-height: 1.5;
      letter-spacing: 0.01em;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--blue-border);
    }

    /* ── Sections label ── */
    .sidebar__nav-label {
      padding: 14px 24px 8px;
      font-size: 0.6rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      /* Raised from 0.28 opacity to properly visible */
      color: var(--on-dark-low);
      flex-shrink: 0;
    }


    /* ── Sidebar section divider ── */
    .sidebar__divider {
      margin: 12px 14px 6px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }

    /* ── Sidebar group label (Bonus Profile) ── */
    .sidebar__group-label {
      padding: 6px 14px 8px;
      font-size: 0.6rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.38);
    }

    /* ── Navigation ── */
    .sidebar__nav {
      flex: 1;
      padding: 0 10px 10px;
      overflow-y: auto;
      overflow-x: hidden;
    }

    .sidebar__btn {
      width: 100%;
      padding: 10px 14px;
      margin-bottom: 1px;
      background: none;
      border: none;
      border-left: 2px solid transparent;
      text-align: left;
      cursor: pointer;
      border-radius: 0 4px 4px 0;
      font-family: var(--sans);
      font-size: 0.875rem;
      font-weight: 400;
      /* Raised to 0.78 — comfortably readable */
      color: var(--on-dark-mid);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      line-height: 1.4;
      transition:
        background var(--t1) var(--ease),
        color var(--t1) var(--ease),
        border-color var(--t1) var(--ease);
    }

    .sidebar__btn:hover {
      background: rgba(255,255,255,0.06);
      color: var(--on-dark-high);
    }

    /* Active: gold left-rule, gold text */
    .sidebar__btn.active {
      background: rgba(180,140,50,0.12);
      border-left-color: var(--gold);
      color: var(--gold-pale);
      font-weight: 500;
    }

    /* Locked section — visually dimmed, cursor blocked */
    .sidebar__btn.locked {
      opacity: 0.38;
      cursor: not-allowed;
      pointer-events: none;
    }

    .sidebar__btn-label { flex: 1; }

    /* Tick */
    .sidebar__tick {
      font-size: 0.72rem;
      color: #4ade80;
      flex-shrink: 0;
      opacity: 0;
      font-weight: 500;
      transition: opacity 0.35s var(--ease);
    }
    .sidebar__tick.visible { opacity: 1; }

    /* ── Sidebar progress — pinned, never scrolls ── */
    .sidebar__progress {
      padding: 12px 24px 14px;
      border-bottom: 1px solid var(--blue-border);
      flex-shrink: 0;
    }

    /* ── Sidebar footer ── */
    .sidebar__footer {
      padding: 14px 24px 22px;
      border-top: 1px solid var(--blue-border);
      flex-shrink: 0;
    }

    .progress__row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 8px;
    }

    /* "Profile Completion" — raised to fully legible */
    .progress__label {
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--on-dark-low);
    }

    .progress__pct {
      font-family: var(--serif);
      font-size: 1.05rem;
      font-weight: 400;
      color: var(--gold-pale);
      line-height: 1;
    }

    .progress__track {
      height: 2px;
      background: rgba(255,255,255,0.1);
      border-radius: 1px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .progress__fill {
      height: 100%;
      background: linear-gradient(90deg, var(--gold), var(--gold-pale));
      border-radius: 1px;
      width: 0%;
      transition: width 0.7s cubic-bezier(0.22,1,0.36,1);
    }

    /* "Last updated" — raised to legible */
    .sidebar__updated {
      font-size: 0.65rem;
      color: var(--on-dark-muted);
      letter-spacing: 0.03em;
    }

    /* ════════════════════════════════════════════════
       MAIN CONTENT
    ════════════════════════════════════════════════ */
    .main {
      margin-left: var(--sidebar-w);
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ── Top bar ── */
    .topbar {
      height: var(--topbar-h);
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 36px;
      flex-shrink: 0;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 16px rgba(0,0,0,0.04);
    }

    .topbar__left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Gold accent rule */
    .topbar__accent {
      width: 2px;
      height: 18px;
      background: var(--gold);
      border-radius: 1px;
      flex-shrink: 0;
    }

    /* "My Profile" — raised to --text-soft, clearly readable */
    .topbar__context {
      font-size: 0.775rem;
      font-weight: 400;
      color: var(--text-soft);
    }

    .topbar__sep {
      font-size: 0.8rem;
      color: var(--border);
    }

    /* Current section — full contrast */
    .topbar__section {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-h);
    }

    .topbar__right {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    /* "Last updated" in top bar — raised to --text-soft */
    .topbar__updated {
      font-size: 0.72rem;
      color: var(--text-soft);
    }

    /* Status chip */
    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 20px;
      background: var(--green-bg);
      color: var(--green);
      border: 1px solid var(--green-border);
    }

    .status-chip__dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse-dot 2.5s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.2; }
    }

    /* ── User info + sign-out (top-right of topbar) ──
       Hidden by default; shown by JS once we confirm a logged-in
       Supabase session and have fetched the user's name. */
    .topbar__user {
      display: none;
      align-items: center;
      gap: 14px;
      padding-left: 14px;
      border-left: 1px solid var(--border);
    }
    .topbar__user.is-visible {
      display: inline-flex;
    }
    .topbar__user-name {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text);
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .topbar__signout {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-soft);
      font-size: 0.72rem;
      font-weight: 500;
      padding: 5px 12px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .topbar__signout:hover {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      border-color: var(--text-soft);
    }

    /* ── iframe ── */
    .main__frame {
      flex: 1;
      border: none;
      width: 100%;
      min-height: calc(100vh - var(--topbar-h));
      display: block;
      background: var(--surface-2);
    }


  </style>
</head>
<body>

<div class="shell">

  <!-- ═══════════ SIDEBAR ═══════════ -->
  <aside class="sidebar">

    <!-- Brand -->
    <div class="sidebar__brand">
      <!--
        Logo: MECULS-gold-white-bold.png
        Gold + white logo works perfectly on deep Prussian blue.
        Relative path: images/logo/MECULS-gold-white-bold.png
        (matches the path used by meculs.com main site, so the
         same logo file serves both the marketing pages and the
         CV portal — single source of truth)
      -->
      <img
        class="brand__img"
        src="images/logo/MECULS-gold-white-bold.png"
        alt="MECULS"
        id="brandImg"
      >
      <!-- Text fallback — JS reveals if image file not found -->
      <div class="brand__text" id="brandText">MECULS</div>

      <!-- Sub-brand: Ikshu ( इक्षु ) | The CV Portal -->
      <div class="brand__subbrand">
        Ikshu <span class="brand__subbrand-deva">( इक्षु )</span> | The CV Portal
      </div>

      <div class="brand__tagline">The recognition true capability deserves</div>
    </div>

    <!-- Profile completion — always visible, never scrolls away -->
    <div class="sidebar__progress">
      <div class="progress__row">
        <span class="progress__label">Profile Completion</span>
        <span class="progress__pct" id="progressPct">0%</span>
      </div>
      <div class="progress__track">
        <div class="progress__fill" id="progressFill"></div>
      </div>
    </div>

    <!-- Inspirational section label -->
    <div class="sidebar__inspire">
      <div class="sidebar__inspire-text">Craft Your Professional Story</div>
    </div>

    <div class="sidebar__nav-label">Sections</div>

    <nav class="sidebar__nav">

      <button class="sidebar__btn"
        data-page="goals_interests.html"
        data-key="Your Goals &amp; Interests"
        data-completion-key="goals_completed">
        <span class="sidebar__btn-label">Your Goals &amp; Interests</span>
        <span class="sidebar__tick" id="tick-1">✓</span>
      </button>

      <button class="sidebar__btn"
        data-page="upload_photo_cv.html"
        data-key="Upload Photo &amp; CV"
        data-completion-key="photo_cv_completed">
        <span class="sidebar__btn-label">Upload Photo &amp; CV</span>
        <span class="sidebar__tick" id="tick-2">✓</span>
      </button>

      <button class="sidebar__btn"
        data-page="profile_category.html"
        data-key="Your Profile Category"
        data-completion-key="profile_category_completed">
        <span class="sidebar__btn-label">Your Profile Category</span>
        <span class="sidebar__tick" id="tick-3">✓</span>
      </button>

      <button class="sidebar__btn"
        data-page="professional_introduction.html"
        data-key="About You"
        data-completion-key="introduction_completed">
        <span class="sidebar__btn-label">About You</span>
        <span class="sidebar__tick" id="tick-4">✓</span>
      </button>

      <button class="sidebar__btn"
        data-page="experience.html"
        data-key="Your Experience"
        data-completion-key="experience_completed">
        <span class="sidebar__btn-label">Your Experience</span>
        <span class="sidebar__tick" id="tick-5">✓</span>
      </button>

      <button class="sidebar__btn"
        data-page="education.html"
        data-key="Your Education"
        data-completion-key="education_completed">
        <span class="sidebar__btn-label">Your Education</span>
        <span class="sidebar__tick" id="tick-6">✓</span>
      </button>

      <button class="sidebar__btn"
        data-page="skills.html"
        data-key="Your Skills"
        data-completion-key="skills_completed">
        <span class="sidebar__btn-label">Your Skills</span>
        <span class="sidebar__tick" id="tick-7">✓</span>
      </button>

      <button class="sidebar__btn"
        data-page="certifications.html"
        data-key="Your Certifications"
        data-completion-key="certifications_completed">
        <span class="sidebar__btn-label">Your Certifications</span>
        <span class="sidebar__tick" id="tick-8">✓</span>
      </button>

      <button class="sidebar__btn"
        data-page="references.html"
        data-key="Your References"
        data-completion-key="references_completed">
        <span class="sidebar__btn-label">Your References</span>
        <span class="sidebar__tick" id="tick-9">✓</span>
      </button>

      <button class="sidebar__btn"
        data-page="preferences.html"
        data-key="Your Preferences"
        data-completion-key="preferences_completed">
        <span class="sidebar__btn-label">Your Preferences</span>
        <span class="sidebar__tick" id="tick-10">✓</span>
      </button>

      <button class="sidebar__btn"
        data-page="languages.html"
        data-key="Your Languages"
        data-completion-key="languages_completed">
        <span class="sidebar__btn-label">Your Languages</span>
        <span class="sidebar__tick" id="tick-11">✓</span>
      </button>


      <!-- ── Bonus Profile sections divider ── -->
      <div class="sidebar__divider"></div>
      <div class="sidebar__group-label">Bonus Profile</div>

      <button class="sidebar__btn"
        data-page="ai_tools.html"
        data-key="AI Tools &amp; Digital Literacy"
        data-completion-key="ai_tools_completed">
        <span class="sidebar__btn-label">AI Tools &amp; Digital Literacy</span>
        <span class="sidebar__tick">✓</span>
      </button>

      <button class="sidebar__btn"
        data-page="consulting_availability.html"
        data-key="Consulting Availability"
        data-completion-key="consulting_completed">
        <span class="sidebar__btn-label">Consulting Availability</span>
        <span class="sidebar__tick">✓</span>
      </button>

      <button class="sidebar__btn"
        data-page="key_achievements.html"
        data-key="Key Achievements"
        data-completion-key="key_achievements_completed">
        <span class="sidebar__btn-label">Key Achievements</span>
        <span class="sidebar__tick">✓</span>
      </button>

      <button class="sidebar__btn"
        data-page="mentorship.html"
        data-key="Mentorship &amp; Coaching"
        data-completion-key="mentorship_completed">
        <span class="sidebar__btn-label">Mentorship &amp; Coaching</span>
        <span class="sidebar__tick">✓</span>
      </button>

      <button class="sidebar__btn"
        data-page="portfolio.html"
        data-key="Work Portfolio"
        data-completion-key="portfolio_completed">
        <span class="sidebar__btn-label">Work Portfolio</span>
        <span class="sidebar__tick">✓</span>
      </button>

      <button class="sidebar__btn"
        data-page="publications.html"
        data-key="Publications &amp; Media"
        data-completion-key="publications_completed">
        <span class="sidebar__btn-label">Publications &amp; Media</span>
        <span class="sidebar__tick">✓</span>
      </button>

      <button class="sidebar__btn"
        data-page="volunteering.html"
        data-key="Volunteering"
        data-completion-key="volunteering_completed">
        <span class="sidebar__btn-label">Volunteering</span>
        <span class="sidebar__tick">✓</span>
      </button>

    </nav>

    <!-- Footer: last updated timestamp -->
    <div class="sidebar__footer">
      <div class="sidebar__updated" id="sidebarLastUpdated"></div>
    </div>

  </aside>

  <!-- ═══════════ MAIN ═══════════ -->
  <div class="main">

    <div class="topbar">
      <div class="topbar__left">
        <div class="topbar__accent"></div>
        <span class="topbar__context">My Profile</span>
        <span class="topbar__sep">›</span>
        <span class="topbar__section" id="currentSectionTitle">Getting Started</span>
      </div>
      <div class="topbar__right">
        <span class="topbar__updated" id="lastUpdated"></span>
        <span class="status-chip">
          <span class="status-chip__dot"></span>
          Active
        </span>
        <span class="topbar__user" id="topbarUser">
          <span class="topbar__user-name" id="topbarUserName"></span>
          <a href="settings.html" class="topbar__signout" id="topbarSettingsLink"
             style="text-decoration:none; display:inline-block;">Settings</a>
          <button type="button" class="topbar__signout" id="topbarSignOutBtn">Sign Out</button>
        </span>
      </div>
    </div>

    <iframe id="contentFrame" class="main__frame" title="Section content"></iframe>

  </div>

</div>


<!-- Load Supabase JS library and config (needed for auth guard, user info, and sign-out)

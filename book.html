  <title>Opening your booking — MECULS</title>

  <!-- ============================================================
       MECULS — book.html
       ------------------------------------------------------------
       The booking gate.

       After a successful Cal.com-product payment, meculs-checkout.js
       redirects the customer here with a one-time booking_token in
       the URL.  This page hands that token to /api/redeem-booking-
       token, which (server-side) looks up the right Cal.com URL and
       returns it.  The page then redirects the customer to Cal.com.

       The Cal.com URLs do NOT appear in this file, in any other HTML
       file, or in any JavaScript the browser receives.  They live
       only inside the server-side function.

       If the token is missing, expired, or forged: the page shows a
       polite error and a pre-filled email link to Rajneesh.
       ============================================================ -->

  <style>
    :root {
      --bg:          #fdfcf7;
      --ink:         #22291f;
      --ink-soft:    #3d4536;
      --brass:       #54420d;
      --brass-deep:  #8a6f3c;
      --sage:        #dfe4d8;
      --error:       #9c3b2e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.55;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.2rem;
    }
    .book-card {
      max-width: 560px;
      width: 100%;
      background: var(--sage);
      border-top: 3px solid var(--brass-deep);
      border-radius: 4px;
      padding: 2.5rem 2.2rem;
      box-shadow: 0 4px 18px rgba(34,41,31,0.08);
      text-align: center;
    }
    .book-eyebrow {
      font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--brass);
      margin-bottom: 0.9rem;
    }
    .book-headline {
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(1.4rem, 2.2vw, 1.85rem);
      font-weight: 500;
      color: var(--ink);
      margin: 0 0 0.7rem;
      line-height: 1.25;
    }
    .book-message {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.02rem;
      color: var(--ink);
      max-width: 48ch;
      margin: 0 auto 1.6rem;
      line-height: 1.6;
    }
    .book-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(107,85,44,0.18);
      border-top-color: var(--brass-deep);
      border-radius: 50%;
      margin: 1rem auto 0;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .book-cta {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: #2f3b2c;
      color: #fdfcf7;
      font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
      font-size: 0.92rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      padding: 0.85rem 1.7rem;
      border-radius: 3px;
      text-decoration: none;
      transition: background 0.18s;
    }
    .book-cta:hover { background: var(--brass); }
    .is-error .book-eyebrow { color: var(--error); }
    .is-error .book-headline { color: var(--error); }
